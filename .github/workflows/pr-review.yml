name: PR Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-review:
    runs-on: ubuntu-latest

    steps:
      - name: Start PR Review Agent
        run: |
          echo "🤖 PR Review Agent started"
          echo "Repository: ${{ github.repository }}"
          echo "PR Number: ${{ github.event.pull_request.number }}"
          echo "PR Title: ${{ github.event.pull_request.title }}"
          echo "PR Author: ${{ github.event.pull_request.user.login }}"

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "📄 Getting PR diff..."

          gh pr diff ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} > pr.diff

      - name: Show diff file
        run: |
          echo "📄 PR diff saved to pr.diff"
          echo "📏 Diff size:"
          wc -c pr.

      - name: Read PR diff
        run: |
          echo "📖 Contents of pr.diff:"
          cat pr.diff


      - name: Complete
        run: |
          echo "✅ PR diff retrieved successfully"
